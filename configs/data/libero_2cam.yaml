train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/libero_mujoco3.3.2/libero_spatial_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_object_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_goal_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_10_no_noops_lerobot
  shape_meta:
    images:
      - key: image
      # - key: observation.images.image
        raw_shape: [3, 512, 512]
        shape: [3, 224, 224]
      - key: wrist_image
      # - key: observation.images.wrist_image
        raw_shape: [3, 512, 512]
        shape: [3, 224, 224]
    action:
      - key: default
      # - key: action
        raw_shape: 7 # before transform
        shape: 7 # after transform
    state:
      - key: default
      # - key: observation.state
        raw_shape: 8 # before transform
        shape: 8 # after transform
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4 # 32 action, 9 video frames
  video_size: [224, 448] # final resize video
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  skip_padding_as_possible: false
  concat_multi_camera: "horizontal"
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 7 # eef_pose (6) + gripper (1)
    proprio_output_dim: 8 # eef_pose (6) + gripper (2)
    delta_action_dim_mask:
      default: [true, true, true, true, true, true, false] # eef poses are delta, gripper is not

    # action & state normalization
    action_state_transforms: null
    # action_state_transforms:
    #   - _target_: fastwam.datasets.lerobot.transforms.libero.LiberoTransform
    use_stepwise_action_norm: False
    norm_default_mode: min/max
    norm_exception_mode: null

    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign

    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  text_embedding_cache_dir: ./data/text_embeds_cache/libero
  context_len: 128
  # TC-Full only. The manifest maps each source task to an audited executable
  # same-scene instruction; disabled for all baseline and TC-C runs.
  counterfactual_manifest_path: null
  counterfactual_negative_probability: 0.0
  # PGC only: successful state-aligned demonstrations collected under the
  # alternate instruction. These directories are provenance-marked and may be
  # balanced/oversampled without changing native normalization statistics.
  pgc_counterfactual_dataset_dirs: []
  pgc_counterfactual_oversample_factor: 1
  # PGC V8 only: replay-verified target-acquisition corrections starting from
  # exact on-policy LIBERO simulator states. Kept separate from offline CF
  # demonstrations so sampling and metrics cannot silently mix the two.
  pgc_closed_loop_corrective_dataset_dirs: []
  pgc_closed_loop_corrective_oversample_factor: 4
  # PGC uses an exact native/counterfactual 1:1 index mix. Disabled for
  # every non-PGC task and enabled by libero_pgc_2cam224.
  pgc_balance_native_counterfactual: false
  # PGC V7 only. Requires a validated `meta/pgc_v7_target_masks/index.json`
  # sidecar in every direct-counterfactual dataset and exposes current-frame
  # target/source/auxiliary object masks as training-only supervision.
  pgc_target_mask_supervision_required: false
  # PGC V5-completion only. Requires the audited gripper-transition sidecar
  # generated by scripts/build_pgc_completion_phases.py. It labels pre-grasp,
  # transport/place, and (when present) release frames without changing RGB or
  # action data.
  pgc_completion_phase_supervision_required: false
  # PGC V9 only. One standalone audited sidecar directory must be supplied for
  # every native and direct-CF dataset, in exactly the dataset concatenation
  # order. No privileged field is consumed by inference.
  pgc_entity_relation_supervision_required: false
  pgc_entity_relation_sidecar_dirs: []
  # V9: exact native:CF=1:1, original:strict=1:1, with strict conflict
  # categories balanced before the outer mixture is constructed.
  pgc_v9_balanced_sampling: false
  pgc_v9_structured_role_sampling: false
  # V9.6 only: an audited V9.3 role-failure index drives equal native-hard,
  # native-easy, historical-CF, and strict-CF optimizer-window sampling.
  pgc_v9_hard_role_curriculum: false
  pgc_v9_hard_role_index_path: null
