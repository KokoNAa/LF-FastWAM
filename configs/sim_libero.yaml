# @package _global_

defaults:
  - train
  - override /task: libero_uncond_2cam224_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  task_suite_name: libero_spatial
  task_id: 0
  num_trials: 50
  output_dir: ./evaluate_results/libero/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Runtime behavior
  env_num: 1
  num_steps_wait: 30
  # Number of policy-controlled environment steps. Null uses the standard
  # LIBERO suite horizon (400 for Object/Spatial/Goal, 700 for 10/90).
  max_steps: null
  replan_steps: 10
  binarize_gripper: true
  use_action_ensembler: false
  visualize_future_video: false

  # Action inference
  action_horizon: null
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false

  # Language-intervention condition: correct / null / shuffled / counterfactual.
  # Shuffled keeps the source success predicate (DTL). Counterfactual imports
  # the paired task's goal predicate while keeping the source scene/state (CIS).
  # Counterfactual always requires an audited manifest.
  instruction_condition: correct
  language_intervention_manifest: null
  instruction_override: null
  # Opt-in behavior-level CIS diagnostics. This records source/alternate goal
  # predicates plus per-object grasp and >=4 cm lift events without changing
  # the policy inputs or simulator success predicate.
  counterfactual_diagnostics: false
  counterfactual_lift_threshold_m: 0.04
  # PGC v9 deployment diagnostics. When enabled, each replanning decision
  # writes ERAF heatmaps/anchors as a compressed NPZ plus a human-readable PNG.
  entity_relation_diagnostics: false
  entity_relation_overlay_dir: null
  # Passive V9 online grounding audit. The policy must run with gate_mode=base;
  # ERAF observes each replan but its outputs never enter the executed action.
  # The sidecar is read only for its audited workspace/mask/predicate contract;
  # online labels are generated from the current MuJoCo state.
  entity_relation_shadow_audit: false
  entity_relation_shadow_sidecar_dir: null
  # Privileged causal diagnostic: replace ERAF predictions with current-state
  # MuJoCo/BDDL truth, then execute the unchanged ERAF->Proposal path.  This is
  # never a deployment mode and requires gate_mode=counterfactual.
  entity_relation_oracle: false
  entity_relation_oracle_sidecar_dir: null
  # Evaluation-only V9.13 ablation. Every replan receives no previous PSCM
  # state and the returned state is discarded; model weights remain unchanged.
  entity_relation_stateless_replan_ablation: false
  # Evaluation-only V9.13 ablation. Preserve only a monotonic per-clause
  # completed bit; pending/holding/retry never cross a replan boundary.
  entity_relation_completion_only_memory_ablation: false

  # Optional external inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  create_only: false
  task_file: null
  task_suite_names:
    - libero_10
    - libero_goal
    - libero_spatial
    - libero_object
  num_gpus: 8
  max_tasks_per_gpu: 2

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
