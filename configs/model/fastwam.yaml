_target_: fastwam.runtime.create_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal" # default
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  use_latent_action_queries: true
  num_latent_queries: 32
  query_rope_offset: 512

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0

langforce_mvp:
  enabled: true
  enable_prior: true
  enable_posterior_advantage: true

  # These are hard assertions in MVP mode: Query is the only task-semantic
  # interface available to action tokens.
  action_reads_raw_video: false
  action_reads_language: false

  lambda_prior_action: 0.10
  lambda_posterior_advantage: 0.10
  posterior_advantage_margin_ratio: 0.05
  detach_prior_video_cache: true

# TC-FastWAM is opt-in. v2/v3 implement TC-C; v4 adds Action-Future and
# same-scene counterfactual ranking; v5 adds action positives and v6 adds
# current-state target-object grounding.
# Prior/advantage remain disabled on the mainline.
transition_contract:
  enabled: false
  version: 2
  projection_dim: 512
  temperature: 0.07
  contract_weight: 0.05
  action_future_weight: 1.0
  counterfactual_weight: 0.05
  counterfactual_margin: 0.2
  counterfactual_action_positive_weight: 0.10
  counterfactual_action_query_weight: 1.0
  counterfactual_action_effect_weight: 1.0
  counterfactual_action_separation_weight: 0.05
  counterfactual_action_separation_margin: 0.05
  counterfactual_action_prototype_slots: 64
  counterfactual_action_prototype_momentum: 0.95
  # TC v6 learns a language-conditioned target distribution over patches in
  # the current state.  A clean-latent interaction teacher supervises correct
  # demonstrations; training-only appearance prototypes provide alternate
  # target positives in that same state.  Only the small grounder is deployed.
  use_state_conditioned_grounding: false
  state_grounding_weight: 0.10
  state_grounding_correct_weight: 1.0
  state_grounding_counterfactual_weight: 1.0
  state_grounding_separation_weight: 0.25
  state_grounding_overlap_margin: 0.25
  state_grounding_router_bias: 2.0
  state_grounding_teacher_topk: 0.15
  state_grounding_teacher_temperature: 0.25
  state_grounding_hidden_dim: 256
  state_grounding_temperature: 0.07
  state_grounding_prototype_slots: 64
  state_grounding_prototype_momentum: 0.95
  state_grounding_prototype_temperature: 0.07
  state_grounding_prototype_topk: 0.10
  outcome_stop_gradient: true
  use_transition_router: true
  router_num_heads: 8
  direct_action_video_access: false
  direct_action_text_access: false
  direct_video_text_access: true
  action_conditioned_video: false
  use_action_effect: false
  use_counterfactual_ranking: false
  use_counterfactual_action_positive: false
  action_effect_hidden_dim: 512
  action_effect_num_heads: 8
  action_effect_num_layers: 2
  warmup_ratio: 0.05
  ramp_ratio: 0.05
  # v2 keeps the pretrained/M1 posterior-query policy during early recovery,
  # then linearly replaces it with final-Video-hidden routed transitions.
  policy_recovery_ratio: 0.10
  router_ramp_ratio: 0.20
  freeze_m1_during_recovery: true
  # TC v3+ policy protection freezes the loaded M1 adapter and distills the
  # pure-Router action velocity from its joint-MoT posterior output while the
  # transition contracts continue optimizing Router representations.
  policy_distillation_enabled: false
  policy_distillation_weight: 1.0
  freeze_m1_policy: false

# Policy-Guarded Counterfactual FastWAM. PGC is mutually exclusive with the
# LangForce/TC mainlines. v1/v2 retain their historical independent Action
# Expert for checkpoint compatibility. v3 shares one immutable released Base
# Action Expert and learns a bounded flow-velocity residual. v4 instead learns
# one bounded temporal correction after the frozen Base sampler has completed,
# then deploys an FP32 pairwise gate that falls back exactly to Base. v5 adds
# same-state paired-language identifiability, execution-prefix alignment, and
# explicit wrong-language / bad-proposal verifier negatives. v6 replaces the
# direct language-to-Proposal path with a language-selected visual target
# bottleneck and adds successful-transition / task-appearance supervision. v7
# replaces those ambiguous teachers with training-only current-state element
# masks and routes every action query through camera-aware object tokens.
policy_guard:
  enabled: false
  version: 2
  num_action_queries: 32
  query_rope_offset: 512
  num_goal_tokens: 4
  hidden_dim: 512
  projection_dim: 256
  num_heads: 8
  verifier_hidden_dim: 256
  counterfactual_action_weight: 1.0
  # v2 anchors native samples to the frozen Base velocity at the same noisy
  # action/timestep, while direct CF samples receive flow-matching supervision.
  native_distillation_weight: 1.0
  # v3 penalizes residual energy/jitter and hard-bounds every action velocity
  # dimension. A scalar cap is broadcast over action dimensions.
  residual_regularization_weight: 0.01
  residual_smoothness_weight: 0.01
  velocity_residual_max_abs: 1.0
  # v4 runs the immutable Base sampler to completion and applies one temporal
  # correction to the deployed normalized action chunk. Formal training must
  # use the same action inference-step count as evaluation.
  action_chunk_residual_max_abs: 2.0
  rollout_num_inference_steps: 10
  proposal_hidden_dim: 256
  proposal_num_heads: 8
  proposal_num_layers: 2
  action_gripper_weight: 2.0
  # The v4 verifier is an FP32 temporal pairwise model. It regresses raw
  # proposal advantage; no sigmoid probability or minimum-CF score is used.
  verifier_num_heads: 8
  verifier_num_layers: 2
  advantage_temperature: 0.25
  advantage_clip: 4.0
  candidate_max_saturation_fraction: 0.25
  candidate_max_delta_rms: 2.0
  # LIBERO executes only the first 10 of the 32 predicted actions before
  # replanning. v5 gives that deployed prefix full weight while retaining a
  # small suffix auxiliary loss.
  execution_prefix_steps: 10
  suffix_loss_weight: 0.10
  # Optional V5-completion continuation. Phase labels come from the exact
  # gripper commands in each audited successful PGC trajectory. Transport and
  # release states receive stronger action supervision while the learned V5
  # language encoder and Verifier remain frozen.
  completion_phase_enabled: false
  completion_transport_weight: 2.0
  completion_release_weight: 3.0
  completion_train_proposal_only: true
  # On every audited CF state, source language must reproduce exact Base while
  # counterfactual language must produce the demonstrated successful residual.
  same_state_source_zero_weight: 1.0
  goal_separation_weight: 0.25
  goal_separation_margin: 0.20
  residual_separation_weight: 0.25
  residual_separation_margin: 0.05
  # Stage-2 verifier negatives prevent the old shortcut "any CF row is good".
  verifier_wrong_language_weight: 0.50
  verifier_bad_candidate_weight: 0.50
  # PGC v6: language scores current-frame visual patches, while the Proposal
  # receives only the selected visual value plus language-independent query
  # seeds. Future demonstration frames are training-only and locate the
  # interaction region; task appearance prototypes transfer that target to a
  # same-state counterfactual scene. Neither teacher is used at deployment.
  target_binding_interaction_weight: 1.0
  target_binding_prototype_weight: 0.50
  target_binding_source_weight: 0.50
  target_binding_hard_negative_weight: 0.50
  target_binding_separation_weight: 0.25
  target_binding_hard_negative_margin: 0.20
  target_binding_separation_margin: 0.15
  target_binding_teacher_topk: 0.15
  target_binding_teacher_temperature: 0.25
  target_binding_hidden_dim: 256
  target_binding_num_heads: 8
  target_binding_temperature: 0.07
  target_binding_prototype_slots: 64
  target_binding_prototype_momentum: 0.95
  target_binding_prototype_temperature: 0.07
  target_binding_prototype_topk: 0.10
  # PGC v7 replaces the future-change/prototype teachers with explicit
  # training-only current-frame element masks. The Proposal receives a small
  # set of camera-aware spatial object tokens; every action query reads those
  # tokens independently. No mask or segmentation input is needed at rollout.
  target_binding_num_object_tokens: 8
  target_binding_camera_count: 2
  target_binding_visual_aspect_ratio: 2.0
  target_mask_weight: 1.0
  source_mask_weight: 0.50
  aux_mask_weight: 0.50
  mask_mass_weight: 0.50
  cross_object_weight: 0.50
  cross_object_margin: 0.25
  # Stage A learns only language-to-visual binding. Stage B linearly enables
  # V5 action objectives; the verifier has its own later schedule below.
  target_binding_action_start_step: 1000
  target_binding_action_ramp_steps: 500
  # First learn the directly supervised residual. Only then train the moving
  # Verifier/alignment objectives, with a linear optimizer-step ramp. For
  # v6/v7, the effective start is also clamped to action_start + action_ramp.
  verifier_start_step: 1000
  verifier_ramp_steps: 500
  # Goal information is injected into the query-free/raw-visual Action Expert
  # through a final-projection-zero residual adapter.
  goal_residual_scale: 1.0
  verifier_weight: 0.25
  verifier_margin: 0.20
  verifier_action_mse_temperature: 0.25
  goal_action_alignment_weight: 0.10
  alignment_temperature: 0.07
  gate_mode: guarded
  gate_threshold: 0.20
  min_counterfactual_score: 0.60
  require_direct_counterfactual_actions: true

# Parameter-efficient fine-tuning. Disabled by default so released full
# checkpoints retain their original behavior; LoRA adapters auto-enable when
# an adapter checkpoint is loaded.
lora:
  enabled: false
  rank: 16
  alpha: 32
  dropout: 0.05
  experts: [video, action]
  target_modules:
    - text_embedding.0
    - text_embedding.2
    - blocks.*.self_attn.q
    - blocks.*.self_attn.k
    - blocks.*.self_attn.v
    - blocks.*.self_attn.o
    - blocks.*.cross_attn.q
    - blocks.*.cross_attn.k
    - blocks.*.cross_attn.v
    - blocks.*.cross_attn.o
    - blocks.*.ffn.0
    - blocks.*.ffn.2
  extra_trainable_patterns:
    - action_expert.latent_action_queries
    - action_expert.action_encoder.*
    - action_expert.head.*
    - proprio_encoder.*
