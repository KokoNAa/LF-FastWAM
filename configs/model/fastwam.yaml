_target_: fastwam.runtime.create_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal" # default
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  use_latent_action_queries: true
  num_latent_queries: 32
  query_rope_offset: 512

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0

langforce_mvp:
  enabled: true
  enable_prior: true
  enable_posterior_advantage: true

  # These are hard assertions in MVP mode: Query is the only task-semantic
  # interface available to action tokens.
  action_reads_raw_video: false
  action_reads_language: false

  lambda_prior_action: 0.10
  lambda_posterior_advantage: 0.10
  posterior_advantage_margin_ratio: 0.05
  detach_prior_video_cache: true

# TC-FastWAM is opt-in. v2/v3 implement TC-C; v4 adds Action-Future and
# same-scene counterfactual ranking; v5 adds counterfactual action positives.
# Prior/advantage remain disabled on the mainline.
transition_contract:
  enabled: false
  version: 2
  projection_dim: 512
  temperature: 0.07
  contract_weight: 0.05
  action_future_weight: 1.0
  counterfactual_weight: 0.05
  counterfactual_margin: 0.2
  counterfactual_action_positive_weight: 0.10
  counterfactual_action_query_weight: 1.0
  counterfactual_action_effect_weight: 1.0
  counterfactual_action_separation_weight: 0.05
  counterfactual_action_separation_margin: 0.05
  counterfactual_action_prototype_slots: 64
  counterfactual_action_prototype_momentum: 0.95
  outcome_stop_gradient: true
  use_transition_router: true
  router_num_heads: 8
  direct_action_video_access: false
  direct_action_text_access: false
  direct_video_text_access: true
  action_conditioned_video: false
  use_action_effect: false
  use_counterfactual_ranking: false
  use_counterfactual_action_positive: false
  action_effect_hidden_dim: 512
  action_effect_num_heads: 8
  action_effect_num_layers: 2
  warmup_ratio: 0.05
  ramp_ratio: 0.05
  # v2 keeps the pretrained/M1 posterior-query policy during early recovery,
  # then linearly replaces it with final-Video-hidden routed transitions.
  policy_recovery_ratio: 0.10
  router_ramp_ratio: 0.20
  freeze_m1_during_recovery: true
  # TC v3+ policy protection freezes the loaded M1 adapter and distills the
  # pure-Router action velocity from its joint-MoT posterior output while the
  # transition contracts continue optimizing Router representations.
  policy_distillation_enabled: false
  policy_distillation_weight: 1.0
  freeze_m1_policy: false

# Parameter-efficient fine-tuning. Disabled by default so released full
# checkpoints retain their original behavior; LoRA adapters auto-enable when
# an adapter checkpoint is loaded.
lora:
  enabled: false
  rank: 16
  alpha: 32
  dropout: 0.05
  experts: [video, action]
  target_modules:
    - text_embedding.0
    - text_embedding.2
    - blocks.*.self_attn.q
    - blocks.*.self_attn.k
    - blocks.*.self_attn.v
    - blocks.*.self_attn.o
    - blocks.*.cross_attn.q
    - blocks.*.cross_attn.k
    - blocks.*.cross_attn.v
    - blocks.*.cross_attn.o
    - blocks.*.ffn.0
    - blocks.*.ffn.2
  extra_trainable_patterns:
    - action_expert.latent_action_queries
    - action_expert.action_encoder.*
    - action_expert.head.*
    - proprio_encoder.*
