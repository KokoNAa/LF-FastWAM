# @package _global_

defaults:
  - override /data: robotwin
  - override /model: fastwam
  - _self_

# RoboTwin counterpart of the LIBERO LoRA-only/no-ERAF control. Sidecars are
# used for audited pool boundaries and language pairs, never to construct ERAF.
batch_size: 1
num_workers: 2
gradient_accumulation_steps: 4

model:
  mot_checkpoint_mixed_attn: true
  action_dit_config:
    use_latent_action_queries: false
  langforce_mvp:
    enabled: false
    enable_prior: false
    enable_posterior_advantage: false
  transition_contract:
    enabled: false
  policy_guard:
    enabled: false
  lora:
    enabled: true
    rank: 16
    alpha: 16
    dropout: 0.05
    experts: [video, action]
    extra_trainable_patterns: []
    paired_language_control:
      enabled: true
      bidirectional_supervision: true
      deployment_matched_action_cache: true
      world_language_weight: 0.10
      world_language_margin: 0.01
      native_action_weight: 1.0
      counterfactual_action_weight: 1.0
      action_language_weight: 1.0
      action_language_margin: 0.01
      regularization_weight: 1.0e-6

data:
  train:
    _target_: fastwam.datasets.lerobot.robotwin_no_eraf_dataset.RoboTwinNoERAFFourPoolDataset
    dataset_dirs: []
    pgc_counterfactual_dataset_dirs: []
    pgc_closed_loop_corrective_dataset_dirs: []
    pgc_counterfactual_oversample_factor: 1
    pgc_closed_loop_corrective_oversample_factor: 1
    pgc_balance_native_counterfactual: false
    pgc_entity_relation_supervision_required: true
    pgc_entity_relation_sidecar_dirs: []
    pgc_bidirectional_language_supervision_required: true
    pgc_v9_balanced_sampling: false
    pgc_pair_balanced_sampling: false
    pgc_v9_structured_role_sampling: false
    pgc_v9_closed_loop_rebinding: false
    pgc_v9_phase_safe_memory: false
    pgc_v9_closed_loop_native_dataset_count: 0
    pgc_v9_safe_gain_counterfactual_replay: false
    pgc_robotwin_offline_native_dataset_count: 0
    pgc_robotwin_closed_loop_native_dataset_count: 0
    pgc_robotwin_historical_cf_dataset_count: 0
    pgc_robotwin_strict_cf_dataset_count: 0
  val: null

learning_rate: 5.0e-6
lr_scheduler_type: cosine
weight_decay: 1.0e-2
max_grad_norm: 1.0
num_epochs: 1
max_steps: 10000
log_every: 10
save_every: 250
eval_every: 0
save_training_state: false
resume: null
