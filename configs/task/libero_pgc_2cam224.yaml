# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: fastwam
  - _self_

# PGC is trained across all four LIBERO suites. Native demonstrations preserve
# broad task coverage; `pgc_counterfactual_dataset_dirs` must point to separate
# successful state-aligned alternate-instruction trajectories.
# Four GPUs x micro-batch 1 x accumulation 4 = effective global batch 16.
# The immutable 6.8B base and the full independent Action Expert coexist on
# every rank, so the upstream full-training micro-batch of 16 is not safe here.
batch_size: 1
num_workers: 2

model:
  mot_checkpoint_mixed_attn: true
  action_dit_config:
    use_latent_action_queries: false
  langforce_mvp:
    enabled: false
    enable_prior: false
    enable_posterior_advantage: false
  transition_contract:
    enabled: false
  policy_guard:
    enabled: true
    version: 1
  lora:
    enabled: false

data:
  train:
    pgc_counterfactual_dataset_dirs: []
    pgc_counterfactual_oversample_factor: 2
    counterfactual_manifest_path: null
    counterfactual_negative_probability: 0.0

lr_scheduler_type: cosine
learning_rate: 1.0e-5
num_epochs: 1
max_steps: 4000
log_every: 10
save_every: 500
eval_every: 0
gradient_accumulation_steps: 4
weight_decay: 1.0e-2
resume: null
save_training_state: false
