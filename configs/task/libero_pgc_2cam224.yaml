# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: fastwam
  - _self_

# PGC is trained one LIBERO suite at a time during staged validation. Native
# demonstrations and `pgc_counterfactual_dataset_dirs` must cover exactly the
# same suite; the guarded launcher rejects cross-suite leakage. Four-suite joint
# training remains an explicitly locked final experiment.
# Four GPUs x micro-batch 1 x accumulation 4 = effective global batch 16.
# v2 uses an independent Action Expert; v3 overrides the version and LoRA
# switches from its launcher and keeps only one immutable 6.8B Base plus the
# small Goal Graph, bounded velocity residual, and Verifier.
batch_size: 1
num_workers: 2

model:
  mot_checkpoint_mixed_attn: true
  action_dit_config:
    use_latent_action_queries: false
  langforce_mvp:
    enabled: false
    enable_prior: false
    enable_posterior_advantage: false
  transition_contract:
    enabled: false
  policy_guard:
    enabled: true
    version: 2
  lora:
    enabled: true
    rank: 16
    alpha: 32
    dropout: 0.05
    experts: [action]
    extra_trainable_patterns: []

data:
  train:
    pretrained_norm_stats: ./checkpoints/fastwam_release/libero_uncond_2cam224_dataset_stats.json
    pgc_counterfactual_dataset_dirs: []
    pgc_counterfactual_oversample_factor: 1
    pgc_balance_native_counterfactual: true
    counterfactual_manifest_path: null
    counterfactual_negative_probability: 0.0
    pgc_entity_relation_supervision_required: false
    pgc_entity_relation_sidecar_dirs: []
    pgc_v9_balanced_sampling: false
    pgc_v9_structured_role_sampling: false
    pgc_v9_hard_role_curriculum: false
    pgc_v9_hard_role_index_path: null
    pgc_v9_closed_loop_rebinding: false
    pgc_v9_closed_loop_native_dataset_count: 0

lr_scheduler_type: cosine
learning_rate: 1.0e-5
num_epochs: 1
max_steps: 4000
log_every: 10
save_every: 500
eval_every: 0
gradient_accumulation_steps: 4
weight_decay: 1.0e-2
resume: null
save_training_state: false
