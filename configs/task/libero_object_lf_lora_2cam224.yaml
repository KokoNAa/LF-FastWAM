# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: fastwam
  - _self_

# Controlled Object-only B0/M1 comparison. Both variants start from the same
# released FastWAM checkpoint and see exactly the same Object examples.
data:
  train:
    dataset_dirs:
      - ./data/libero_mujoco3.3.2/libero_object_no_noops_lerobot
    pretrained_norm_stats: ./checkpoints/fastwam_release/libero_uncond_2cam224_dataset_stats.json

# Four GPUs x micro-batch 1 x accumulation 4 = effective global batch 16.
batch_size: 1
num_workers: 2
gradient_accumulation_steps: 4

model:
  mot_checkpoint_mixed_attn: true
  lora:
    enabled: true
    rank: 16
    alpha: 32
    dropout: 0.05

learning_rate: 2.0e-4
lr_scheduler_type: cosine
weight_decay: 0.0
num_epochs: 1
max_steps: null
max_grad_norm: 1.0
log_every: 1
save_every: 500
eval_every: 0

# LoRA adapters remain compact; the released base is not duplicated.
save_training_state: false
resume: null
